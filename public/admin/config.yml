backend:
  name: github
  repo: sp4ghet/rashinban_cms
  branch: main
  # リモート(本番URL)から編集する場合は sveltia-cms-auth をCloudflare Workersに
  # デプロイしてそのURLを指定する。ローカル編集 (localhost) だけなら不要。
  base_url: https://sveltia-cms-auth.rikuo-hase1997.workers.dev

media_folder: public/assets/images
public_folder: /assets/images

site_url: https://cms.rashinban.org
display_url: https://cms.rashinban.org

collections:
  - name: news
    label: ニュース (2026)
    label_singular: ニュース記事
    folder: src/content/news
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    fields:
      - { label: タイトル(一覧・OGP用), name: title, widget: string, preview: false }
      - { label: 見出し(記事冒頭に表示・未入力時はタイトルを使用), name: headline, widget: string, required: false }
      - { label: 日付, name: date, widget: datetime, format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { label: 説明(OGP用・任意), name: description, widget: string, required: false, preview: false }
      - { label: OGP画像(任意), name: ogImage, widget: image, required: false, preview: false }
      - { label: リンク先URL(設定すると記事ページを作らず、一覧からこのURLへ飛ぶ), name: link, widget: string, required: false, preview: false }
      - { label: 本文, name: body, widget: markdown }

  - name: faq
    label: FAQ (2026)
    label_singular: FAQ
    folder: src/content/faq
    create: true
    extension: yaml
    format: yaml
    identifier_field: question
    summary: '{{question}}'
    sortable_fields: [order, question]
    fields:
      - { label: 質問, name: question, widget: string }
      - { label: 回答, name: answer, widget: text }
      - { label: 表示順, name: order, widget: number, value_type: int, default: 0 }

  - name: pages
    label: 固定ページ (2026)
    files:
      - name: about
        label: ABOUT
        file: src/content/pages/about.yaml
        fields: &page2026_fields
          - { label: ページタイトル(英字見出し), name: title, widget: string }
          - { label: 説明(OGP用・任意), name: description, widget: string, required: false }
          - label: セクション
            name: sections
            widget: list
            types:
              - name: text
                label: 本文セクション
                widget: object
                summary: '{{fields.headingEn}}'
                fields:
                  - { label: 見出し(英字), name: headingEn, widget: string }
                  - { label: 見出し横の日本語(任意), name: headingJa, widget: string, required: false }
                  - { label: 枠囲みの注意書き(任意), name: notice, widget: text, required: false }
                  - { label: 本文(任意), name: body, widget: markdown, required: false }
                  - { label: 画像(任意), name: image, widget: image, required: false }
              - name: gameday
                label: 開催日
                widget: object
                summary: '{{fields.headingEn}}'
                fields:
                  - { label: 見出し(英字), name: headingEn, widget: string, default: GAME DAY }
                  - { label: 見出し横の日本語(任意), name: headingJa, widget: string, required: false, default: 開催日 }
                  - label: 日程
                    name: days
                    widget: list
                    summary: '{{fields.label}} {{fields.date}}'
                    fields:
                      - { label: 'ラベル(例: DAY1)', name: label, widget: string }
                      - { label: '日付(例: 10/24)', name: date, widget: string }
                      - { label: '曜日(例: [SAT])', name: dow, widget: string }
                      - { label: 説明, name: description, widget: string, required: false }
                      - { label: 注記(※〜・任意), name: note, widget: string, required: false }
              - name: venue
                label: 会場
                widget: object
                summary: '{{fields.headingEn}}'
                fields:
                  - { label: 見出し(英字), name: headingEn, widget: string, default: VENUE }
                  - { label: 見出し横の日本語(任意), name: headingJa, widget: string, required: false, default: 会場 }
                  - { label: 会場名, name: name, widget: string }
                  - { label: 住所, name: address, widget: string, required: false }
                  - { label: アクセス, name: access, widget: string, required: false }
                  - { label: Google MapsのURL, name: mapsUrl, widget: string, required: false }
                  - { label: 写真, name: photo, widget: image, required: false }
              - name: tickets
                label: チケット一覧
                widget: object
                summary: '{{fields.headingEn}}'
                fields:
                  - { label: 見出し(英字), name: headingEn, widget: string, default: TICKETS }
                  - { label: 見出し横の日本語(任意), name: headingJa, widget: string, required: false, default: チケットについて }
                  - { label: 前書き(任意), name: intro, widget: markdown, required: false }
                  - { label: 販売中(オンにすると各チケットが購入ページへのリンクになる), name: onSale, widget: boolean, default: false, required: false }
                  - { label: チケット購入ページURL(販売中のみ使用・全チケット共通), name: url, widget: string, required: false }
                  - { label: '販売開始の告知(販売前にチケット一覧へ重ねて表示・例: 9月1日から販売開始)', name: saleStartText, widget: string, required: false }
                  - label: チケット
                    name: items
                    widget: list
                    summary: '{{fields.label}} {{fields.price}}'
                    fields:
                      - { label: '名称(例: DAY 1 - エントリーチケット)', name: label, widget: string }
                      - { label: '価格(例: 3,000円)', name: price, widget: string }
                      - { label: SOLD OUT表示にする, name: soldOut, widget: boolean, default: false, required: false }
                      - { label: 特典・内容(任意), name: features, widget: list, required: false }
                      - { label: この上に区切り線を入れる, name: separatorAbove, widget: boolean, default: false, required: false }
                  - { label: 注記(※〜・任意), name: notes, widget: markdown, required: false }
              - name: program
                label: 支援プログラムの仕組み (申し込み種別①②③)
                widget: object
                summary: '{{fields.headingEn}}'
                fields:
                  - { label: 見出し(英字), name: headingEn, widget: string, default: HOW THE PROGRAM WORKS }
                  - { label: 見出し横の日本語(任意), name: headingJa, widget: string, required: false, default: 仕組み/申し込み方法 }
                  - label: 申し込み種別
                    name: items
                    widget: list
                    summary: '{{fields.title}}'
                    fields:
                      - { label: '小見出し(例: ① 選手による支援の申し込み)', name: title, widget: string }
                      - { label: リード文(太字・任意), name: lead, widget: text, required: false }
                      - { label: '申請フォームの白帯に表示する文言(例: 選手用申請フォーム・任意)', name: formLabel, widget: string, required: false }
                      - { label: 申請フォームのURL(未入力の間は白帯がリンクにならない), name: formUrl, widget: string, required: false }
                      - { label: '本文(任意・太字ラベルは「**支援金額**：本文」のようにコロンを ** の外に書く)', name: body, widget: markdown, required: false }
                      - { label: '支援フローの見出し(例: [ 選手指名型支援フロー ]・任意)', name: flowLabel, widget: string, required: false }
                      - label: 支援フロー(任意)
                        name: flow
                        widget: list
                        required: false
                        summary: '{{fields.title}}'
                        fields:
                          - label: アイコン
                            name: icon
                            widget: select
                            default: person
                            options:
                              - { label: 人物(申請), value: person }
                              - { label: マッチング, value: match }
                              - { label: 吹き出し(やり取り), value: chat }
                              - { label: お金(送金・補助), value: money }
                          - { label: 内容, name: title, widget: string }
                          - { label: 補足(小さく表示・任意), name: note, widget: string, required: false }
              - name: applications
                label: 申請選手一覧 (「選手申請 (2026)」の内容を表示)
                widget: object
                summary: '{{fields.headingEn}}'
                fields:
                  - { label: 見出し(英字), name: headingEn, widget: string, default: PLAYER APPLICATIONS }
                  - { label: 見出し横の日本語(任意), name: headingJa, widget: string, required: false, default: 申請選手一覧 }
                  - { label: 前書き(太字・任意), name: intro, widget: text, required: false }
                  - { label: 選手が0人のときに表示する文言(任意), name: emptyText, widget: string, required: false }
              - name: supporters
                label: ご支援者一覧 (「ご支援者 (2026)」の内容を表示)
                widget: object
                summary: '{{fields.headingEn}}'
                fields:
                  - { label: 見出し(英字), name: headingEn, widget: string, default: SUPPORTERS }
                  - { label: 見出し横の日本語(任意), name: headingJa, widget: string, required: false, default: ご支援者一覧 }
                  - { label: 前書き(太字・任意), name: intro, widget: text, required: false }
                  - { label: 選手指名なしのご支援者の見出し, name: generalLabel, widget: string, default: 個人協賛 }
                  - { label: 選手指名ありのご支援者の見出し, name: designatedLabel, widget: string, default: 選手指名支援 }
      - name: players-guide
        label: PLAYERS GUIDE
        file: src/content/pages/players-guide.yaml
        fields: *page2026_fields
      - name: spectator-guide
        label: SPECTATOR GUIDE
        file: src/content/pages/spectator-guide.yaml
        fields: *page2026_fields
      - name: patron
        label: SUPPORT A PLAYER PROGRAM (/patron)
        file: src/content/pages/patron.yaml
        fields: *page2026_fields
      - name: privacy-policy
        label: プライバシーポリシー
        file: src/content/pages/privacy-policy.md
        fields:
          - { label: ページタイトル(英字見出し), name: title, widget: string }
          - { label: 説明(OGP用・任意), name: description, widget: string, required: false }
          - { label: 本文, name: body, widget: markdown }

  # /patron の PLAYER APPLICATIONS に表示 (レートの高い順)
  - name: players
    label: 選手申請 (2026)
    label_singular: 申請選手
    folder: src/content/players
    create: true
    extension: yaml
    format: yaml
    identifier_field: name
    summary: '{{name}} (RATE:{{rating}})'
    sortable_fields: [rating, name]
    fields:
      - { label: 選手名, name: name, widget: string }
      - { label: GeoGuessrプロフィールURL(任意), name: geoguessrUrl, widget: string, required: false }
      - { label: レート, name: rating, widget: number, value_type: int, default: 0 }
      - { label: 選手からの一言(任意), name: comment, widget: text, required: false }
      - { label: 支援成立(オンにするとカードがグレーアウトし「支援成立」と支援者名が表示される), name: supported, widget: boolean, default: false, required: false }
      - { label: 支援者名(支援成立時にカードへ表示・任意), name: supporter, widget: string, required: false }

  # /patron の SUPPORTERS に表示。指名した選手が空なら「個人協賛」、あれば「選手指名支援」
  - name: supporters
    label: ご支援者 (2026)
    label_singular: ご支援者
    folder: src/content/supporters
    create: true
    extension: yaml
    format: yaml
    identifier_field: name
    summary: '{{name}}'
    sortable_fields: [name]
    fields:
      - { label: お名前(掲載名), name: name, widget: string }
      - label: 指名した選手(選手指名型のみ・空なら個人協賛として掲載)
        name: player
        widget: relation
        collection: players
        value_field: name
        search_fields: [name]
        display_fields: [name]
        required: false

  - name: news2025
    label: ニュース (2025)
    label_singular: ニュース記事
    folder: src/content/news2025
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    # 記事ページは 見出し(headline) → 日付 → 本文 の順で表示されるため、
    # プレビューもそれに合わせる (title はOGP・一覧用でページ本体には出ない)
    fields:
      - { label: タイトル(一覧・OGP用), name: title, widget: string, preview: false }
      - { label: 見出し(記事冒頭に表示・未入力時はタイトルを使用), name: headline, widget: string, required: false }
      - { label: 日付, name: date, widget: datetime, format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { label: 説明(OGP用・任意), name: description, widget: string, required: false, preview: false }
      - { label: OGP画像(任意), name: ogImage, widget: image, required: false, preview: false }
      - { label: リンク先URL(設定すると記事ページを作らず、一覧からこのURLへ飛ぶ), name: link, widget: string, required: false, preview: false }
      - { label: 本文, name: body, widget: markdown }

  - name: interviews2025
    label: インタビュー (2025)
    label_singular: インタビュー記事
    folder: src/content/interviews2025
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { label: タイトル, name: title, widget: string, preview: false }
      - { label: 説明(OGP用・任意), name: description, widget: string, required: false, preview: false }
      - { label: OGP画像(任意), name: ogImage, widget: image, required: false, preview: false }
      - { label: 本文, name: body, widget: markdown }

  - name: players2025
    label: 選手 (2025)
    label_singular: 選手
    folder: src/content/players2025
    create: true
    extension: yaml
    format: yaml
    identifier_field: name
    summary: '{{name}} ({{title}})'
    sortable_fields: [order, name]
    fields:
      - { label: 名前, name: name, widget: string }
      - { label: 肩書き(例:予選第1回 優勝), name: title, widget: string }
      - { label: 写真, name: photo, widget: image }
      - { label: 紹介文, name: description, widget: text }
      - { label: インタビュー記事スラッグ(任意・例:shiina), name: interview, widget: string, required: false }
      - { label: 表示順, name: order, widget: number, value_type: int, default: 0 }

  - name: pages2025
    label: 固定ページ (2025)
    files:
      - name: about
        label: ABOUT
        file: src/content/pages2025/about.md
        fields: &page_fields
          - { label: ページタイトル, name: title, widget: string, preview: false }
          - { label: 説明(OGP用・任意), name: description, widget: string, required: false, preview: false }
          - { label: 本文, name: body, widget: markdown }
      - name: tournament
        label: TOURNAMENT
        file: src/content/pages2025/tournament.md
        fields: *page_fields
      - name: tickets
        label: TICKETS & GOODS
        file: src/content/pages2025/tickets.md
        fields: *page_fields
      - name: staff
        label: STAFF
        file: src/content/pages2025/staff.md
        fields: *page_fields
