title: PLAYER'S GUIDE
description: 選手向け情報・エントリーチケット購入ページ
sections:
  - type: text
    headingEn: FOR PLAYERS
    headingJa: GeoGuessr日本最強決定戦【RASHINBAN 2026】
    notice: ''
    body: |-
      ◆本ページは大会参加者向けのエントリーチケット購入ページです◆
      観戦のみを希望される方は[SPECTATOR'S GUIDE](/spectator-guide/)をご確認ください。
    image: ''
  - type: gameday
    headingEn: GAME DAY
    headingJa: 開催日
    days:
      - label: DAY1
        date: 10/24
        dow: '[SAT]'
        description: 2026年10月24日（土）開場 未定 / 開始(予定) 13:00
        note: ※時間は変更となる場合がございます
      - label: DAY2
        date: 10/25
        dow: '[SUN]'
        description: 2026年10月25日（日）開場 未定 / 開始(予定) 13:00
        note: ※時間は変更となる場合がございます
  - type: venue
    headingEn: VENUE
    headingJa: 会場
    name: eスポフィールド
    address: 〒175-0082 東京都板橋区高島平1丁目79-3 トミコシ会館 2F
    access: 西台駅 東口改札より徒歩1分
    mapsUrl: https://maps.app.goo.gl/j33rsySagVjkjJbn7
    photo: /assets/2026/venue.jpg
  - type: text
    headingEn: ENTRY
    headingJa: エントリーについて
    notice: |-
      本大会に参加される方は、必ず本ページから「エントリーチケット」をご購入ください。
      エントリーチケットの購入と、start.ggでのエントリー登録の両方が完了した時点で、エントリー確定となります。
    body: |-
      エントリー開始：2026年9月1日（火）
      定員：最大64名（先着順）
      start.ggへのリンク
    image: ''
  - type: tickets
    headingEn: TICKETS
    headingJa: チケットについて
    intro: |-
      大会参加を希望される方は、本ページからエントリーチケットをご購入ください。

      ▼販売チケット一覧
    onSale: false
    saleStartText: 9月1日から販売開始
    items:
      - label: DAY 1 - 『PLAYER』チケット
        price: 3,000円
        features:
          - Day 1への出場権
          - Day 1会場での観戦（ご自身の試合終了後も、当日はそのまま観戦できます）
        separatorAbove: false
      - label: DAY 1 -『PLAYER』チケット(学割)
        price: 1,000円
        features:
          - Day 1への出場権
          - Day 1会場での観戦（ご自身の試合終了後も、当日はそのまま観戦できます）
        separatorAbove: false
    notes: |-
      ※定員は最大64名・先着順です。定員に達し次第、販売を終了します。  
      ※学割は高校生以下が対象  
      ※DAY 2の観戦を希望される場合は、別途【SPECTOR’S GUIDE】からDAY 2の観戦チケットをご購入ください。  ※ 選手の参加費については、会場使用料、映像・音響・照明機材の手配など本大会の大会設営費のみに充当させていただきます。
  - type: text
    headingEn: TOURNAMENT
    headingJa: 大会形式
    notice: ''
    body: |-
      トーナメント形式

      ・ダブルエリミネーショントーナメント
      1度敗北しても、Lower Bracketで勝ち残ればUpper Bracketの勝者と決勝で戦うことができます。

      試合形式

      ・BO3

      ※詳細なルールは【ルールブックURL / start.gg大会ページ】をご確認ください。
    image: ''
  - type: text
    headingEn: OFFICIAL DISCORD
    headingJa: 公式Discordサーバー
    notice: ''
    body: |-
      大会に関する連絡・質問の受付はすべて公式Discordサーバーで行います。
      ［参加はこちら］[https://discord.gg/hSvNhzMWK](https://discord.gg/hSvNhzMWK)
    image: ''
  - type: text
    headingEn: FOOD & DRINK
    headingJa: 会場での飲食について
    notice: ''
    body: ゲームエリアおよび観戦席では、飲食物の持ち込みは蓋付き容器・ペットボトル飲料のみ可能です。飲食はご遠慮いただき、飲み物のみお召し上がりください。 カフェスペース内では、飲食および飲食物の持ち込みが可能です。
    image: ''
  - type: text
    headingEn: NOTES
    headingJa: 注意事項
    notice: ''
    body: |-
      会場内の様子はライブ配信、ならびにアーカイブ配信されます。 広告宣伝・報道・関係機関への協力等に使われる場合がありますので予めご了承ください。 配信台はプレイヤーの姿をカメラに映して配信するため、プレイヤーは露出が可能な方に限らせていただきます。
      露出を避けたい方はマスク等で対策をお願いします。
    image: ''
