title: PLAYERS GUIDE
description: 選手向け情報・エントリーチケット購入ページ
sections:
  - type: text
    headingEn: FOR PLAYERS
    headingJa: GeoGuessr日本最強決定戦【RASHINBAN 2026】
    notice: ''
    body: |-
      ◆本ページは大会参加者向けのエントリーチケット購入ページです◆
      観戦のみを希望される方は[観戦ページ](/spectator-guide/)をご確認ください。
    image: ''
  - type: gameday
    headingEn: GAME DAY
    headingJa: 開催日
    days:
      - label: DAY1
        date: '10/24'
        dow: '[SAT]'
        description: 2026年10月24日（土）開場 未定 / 開始(予定) 13:00
        note: ※時間は変更となる場合がございます
      - label: DAY2
        date: '10/25'
        dow: '[SUN]'
        description: 2026年10月25日（日）開場 未定 / 開始(予定) 13:00
        note: ※時間は変更となる場合がございます
  - type: venue
    headingEn: VENUE
    headingJa: 会場
    name: eスポフィールド
    address: 〒175-0082 東京都板橋区高島平1丁目79-3 トミコシ会館 2F
    access: 西台駅 東口改札より徒歩1分
    mapsUrl: https://maps.app.goo.gl/j33rsySagVjkjJbn7
    photo: /assets/2026/venue.jpg
  - type: text
    headingEn: ENTRY
    headingJa: エントリーについて
    notice: |-
      本大会に参加される方は、必ず本ページから「エントリーチケット」をご購入ください。
      エントリーチケットの購入と、start.ggでのエントリー登録の両方が完了した時点で、エントリー確定となります。
    body: |-
      エントリー開始：2026年9月1日（火）
      定員：最大64名（先着順）
      start.ggへのリンク
    image: ''
  - type: tickets
    headingEn: TICKETS
    headingJa: チケットについて
    intro: |-
      大会参加を希望される方は、本ページからエントリーチケットをご購入ください。

      ▼販売チケット一覧
    items:
      - label: DAY 1 - エントリーチケット
        price: 0,000円
        features:
          - Day 1への出場権
          - Day 1会場での観戦（ご自身の試合終了後も、当日はそのまま観戦できます）
        separatorAbove: false
      - label: DAY 2 - 観戦チケット
        price: 0,000円
        features: []
        separatorAbove: false
    notes: |-
      ※定員は最大64名・先着順です。定員に達し次第、販売を終了します。
      ※ご購入後のキャンセル・返金はできません。
      ※Day 2の観戦を希望される場合は、別途[観戦チケットページ](/spectator-guide/)からDay 2の観戦チケットをご購入ください。
  - type: text
    headingEn: TOURNAMENT
    headingJa: 大会形式
    notice: ''
    body: |-
      トーナメント形式

      ・ダブルエリミネーショントーナメント
      1度敗北しても、Lower Bracketで勝ち残ればUpper Bracketの勝者と決勝で戦うことができます。

      試合形式

      ・BO3

      ※詳細なルールは【ルールブックURL / start.gg大会ページ】をご確認ください。
    image: ''
  - type: text
    headingEn: OFFICIAL DISCORD
    headingJa: 公式Discordサーバー
    notice: ''
    body: |-
      大会に関する連絡・質問の受付はすべて公式Discordサーバーで行います。
